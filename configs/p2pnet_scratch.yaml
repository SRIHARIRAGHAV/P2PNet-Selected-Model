project:
  name: "Crowd Counting Module"
  model_name: "P2PNet-Scratch"
  training_mode: "scratch"
  random_seed: 42

dataset:
  name: "JHU-CROWD++"
  dataset_root: "../P2PNet/dataset/JHU-CROWD++"
  train_manifest: "train/image_labels.txt"
  validation_manifest: "val/image_labels.txt"
  test_manifest: "test/image_labels.txt"
  train_image_dir: "train/images"
  train_annotation_dir: "train/gt"
  validation_image_dir: "val/images"
  validation_annotation_dir: "val/gt"
  test_image_dir: "test/images"
  test_annotation_dir: "test/gt"
  num_workers: 0
  prefetch_factor: 1
  validation_max_side: 1024
  validate_at_startup: true
  augmentation:
    random_scale_min: 0.7
    random_scale_max: 1.3
    random_flip: true
    patch_size: 128
    patches_per_image: 1
  coordinate_format: "x y width height crowd_type type"

model:
  architecture: "P2PNet"
  backbone: "vgg16_bn"
  num_prediction_points_per_location: 4
  num_classes: 1
  input_resolution: [128, 128]
  pretrained: false
  row: 2
  line: 2
  set_cost_class: 1.0
  set_cost_point: 0.05
  point_loss_coef: 0.0002
  eos_coef: 0.5

training:
  mode: "scratch"
  epochs: 350
  batch_size: 1
  gradient_accumulation_steps: 1
  cpu_num_threads: 2
  cpu_interop_threads: 1
  learning_rate: 0.0001
  backbone_learning_rate: 0.00001
  weight_decay: 0.0001
  optimizer: "Adam"
  lr_scheduler: "StepLR"
  lr_drop: 350
  lr_gamma: 0.1
  validation_interval: 1
  gradient_clip_norm: 0.1
  log_dir: "logs"
  tensorboard_log_dir: "logs/tensorboard"
  smoke_test_train_batches: 2
  smoke_test_validation_batches: 1

gpu:
  device: "auto"
  gpu_device_index: 0
  mixed_precision: true
  amp_dtype: "float16"
  pinned_memory: false
  non_blocking: false
  memory_monitoring: true

evaluation:
  mae: true
  rmse: true
  mape: true
  zero_gt_mape: "omit"
  inference_latency: true
  fps: true
  prediction_confidence_threshold: 0.5
  batch_size: 1
  batch_size_one_benchmark: true

checkpoints:
  checkpoint_dir: "checkpoints"
  save_interval: 1
  best_model_metric: "MAE"
